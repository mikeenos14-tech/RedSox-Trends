<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>The Fenway Almanac — Team</title>
  <link rel="icon" href="https://www.mlbstatic.com/team-logos/111.svg" />
  <link rel="apple-touch-icon" sizes="180x180" href="https://midfield.mlbstatic.com/v1/team/111/spots/180" />
  <meta name="apple-mobile-web-app-title" content="Fenway Almanac" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0d2b56" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body class="page-league">
  <div class="top-bunting"></div>
  <div class="wall-edge left"></div>
  <div class="wall-edge right"></div>
  <header>
    <div class="header-brand">
      <img src="https://www.mlbstatic.com/team-logos/111.svg" alt="Boston Red Sox logo" class="team-logo" />
      <div>
        <h1>The <span class="accent-green">Fenway</span> <span class="accent">Almanac</span></h1>
        <p class="header-tagline">Boston Red Sox Season Trends &amp; Analytics</p>
      </div>
    </div>
    <p id="record-line" class="subtitle">Loading…</p>
  </header>

  <nav class="site-nav">
    <a href="/">Home<span class="nav-live-dot" hidden></span></a>
    <a href="/league.html" class="active">League</a>
    <a href="/players.html">Players</a>
    <a href="/statcast.html">Statcast</a>
    <a href="/games.html">Games</a>
  </nav>

  <main>
    <a href="/league.html" class="player-back-link">&larr; Back to League</a>

    <section class="player-hero" id="team-hero">
      <div class="skeleton" style="width: 80px; height: 80px; border-radius: 50%;"></div>
      <div class="player-hero-info">
        <div class="skeleton skeleton-line long" style="width: 240px; height: 1.8rem;"></div>
        <div class="skeleton skeleton-line medium" style="margin-top: 0.6rem;"></div>
      </div>
    </section>

    <section class="player-stats-section" id="team-series-section" hidden>
      <h2>Season Series vs. Red Sox</h2>
      <div class="cards" id="team-series-cards"></div>
    </section>

    <section class="league-section" id="team-rank-section">
      <h2>Where They Rank <span class="section-sub">of 30 MLB teams</span></h2>
      <div class="cards" id="team-rank-cards">
        <div class="card"><span class="skeleton skeleton-card"></span></div>
        <div class="card"><span class="skeleton skeleton-card"></span></div>
        <div class="card"><span class="skeleton skeleton-card"></span></div>
        <div class="card"><span class="skeleton skeleton-card"></span></div>
      </div>
    </section>

    <section class="players-section" id="team-hitters-section" hidden>
      <h2>Top Hitters <span class="section-sub">min. 100 PA</span></h2>
      <div class="table-scroll">
        <table id="team-hitters-table" class="stat-table">
          <thead>
            <tr><th>Name</th><th>Pos</th><th>AVG</th><th>OPS</th><th>HR</th><th>RBI</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="players-section" id="team-pitchers-section" hidden>
      <h2>Top Pitchers <span class="section-sub">min. 20 IP</span></h2>
      <div class="table-scroll">
        <table id="team-pitchers-table" class="stat-table">
          <thead>
            <tr><th>Name</th><th>Role</th><th>ERA</th><th>FIP</th><th>K-BB%</th><th>IP</th></tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>

    <section class="player-stats-section" id="team-next-section" hidden>
      <h2>Next Matchup</h2>
      <p id="team-next-body" class="muted"></p>
    </section>
  </main>

  <script src="common.js"></script>
  <script src="team.js"></script>
</body>
</html>
