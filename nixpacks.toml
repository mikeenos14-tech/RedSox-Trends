# Tells Railway's Nixpacks builder how to build/run this app, since the
# actual Python project lives in backend/ rather than the repo root (Nixpacks'
# own auto-detection looks for requirements.txt at the root and would miss
# it otherwise). Mirrors the exact build/start commands already proven
# working in render.yaml.
providers = ["python"]

[phases.install]
cmds = ["pip install -r backend/requirements.txt"]

[start]
# Nixpacks' install-phase virtualenv PATH doesn't reliably carry into the
# start phase's shell, so the bare "uvicorn" console script isn't found
# there even though pip installed it fine at build time. "python -m
# uvicorn" only needs python itself on PATH and finds the package via
# site-packages either way.
cmd = "python -m uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
