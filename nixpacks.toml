# Tells Railway's Nixpacks builder how to build/run this app, since the
# actual Python project lives in backend/ rather than the repo root (Nixpacks'
# own auto-detection looks for requirements.txt at the root and would miss
# it otherwise). Mirrors the exact build/start commands already proven
# working in render.yaml.
providers = ["python"]

# mise (the tool Nixpacks uses under the hood to install the pinned Python
# version) fails outright on every recent python-build-standalone release
# on Railway's builder right now — "No GitHub artifact attestations found"
# for 3.12.7 *and* 3.12.8, so it's not a bad version pin, it's this specific
# verification step being broken/unreachable in that build environment.
# This is the fix the error message itself points at.
[variables]
MISE_PYTHON_GITHUB_ATTESTATIONS = "false"

[phases.install]
cmds = ["pip install -r backend/requirements.txt"]

[start]
cmd = "uvicorn app.main:app --app-dir backend --host 0.0.0.0 --port $PORT"
